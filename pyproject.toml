[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "poker_ai"
authors = [{name = "Leon Fedden", email = "leonfedden@gmail.com"}, {name = "Colin Manko"}]
description = "Open source implementation of a CFR based poker AI player."
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
urls = {Homepage = "https://github.com/fedden/poker_ai"}
requires-python = ">=3.7"
dynamic = ["version", "dependencies"]

[tool.setuptools]
script-files = ['bin\poker_ai']
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tools.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
